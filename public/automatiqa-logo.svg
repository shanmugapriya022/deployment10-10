<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Infinity loop linear gradient: Royal Blue -> Cyan -> Emerald Green -->
    <linearGradient id="fullInfGrad" x1="8%" y1="25%" x2="92%" y2="65%">
      <stop offset="0%" stop-color="#003893" />
      <stop offset="22%" stop-color="#005BEA" />
      <stop offset="45%" stop-color="#0096C7" />
      <stop offset="62%" stop-color="#00B4D8" />
      <stop offset="80%" stop-color="#00C9A7" />
      <stop offset="92%" stop-color="#00D26A" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- QA wordmark gradient -->
    <linearGradient id="qaWordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087E8B" />
      <stop offset="40%" stop-color="#00A896" />
      <stop offset="80%" stop-color="#00D26A" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- Transparency mask for top-right pixels -->
    <mask id="pixelCutoutMask">
      <rect x="0" y="0" width="500" height="380" fill="white" />
      <path 
        d="M 320 58 C 356 58, 400 80, 400 115" 
        stroke="black" 
        stroke-width="46" 
        stroke-linecap="square" 
        fill="none" 
      />
    </mask>
  </defs>

  <!-- INFINITY SYMBOL -->
  <g id="infinity-group">
    <!-- Main loop: Center is at (250, 125). Left center (140, 125), Right center (360, 125) -->
    <path 
      d="M 250 125 
         C 285 75, 322 58, 360 58 
         C 405 58, 440 90, 440 125 
         C 440 165, 400 196, 360 196 
         C 320 196, 285 168, 250 125 
         C 215 82, 180 58, 140 58 
         C 95 58, 60 90, 60 125 
         C 60 165, 100 196, 140 196 
         C 178 196, 215 168, 250 125 Z" 
      stroke="url(#fullInfGrad)" 
      stroke-width="38" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      mask="url(#pixelCutoutMask)"
      fill="none" 
    />

    <!-- Digital Pixel Blocks replacing top-right corner -->
    <g id="pixel-blocks">
      <!-- Main curve pixel columns -->
      <rect x="330" y="42" width="18" height="18" rx="2.5" fill="#00C9A7" />
      <rect x="353" y="42" width="18" height="18" rx="2.5" fill="#00D26A" />
      <rect x="376" y="42" width="18" height="18" rx="2.5" fill="#00E676" />
      <rect x="399" y="42" width="18" height="18" rx="2.5" fill="#00D26A" />

      <rect x="330" y="65" width="18" height="18" rx="2.5" fill="#00B4D8" />
      <rect x="353" y="65" width="18" height="18" rx="2.5" fill="#00C9A7" />
      <rect x="376" y="65" width="18" height="18" rx="2.5" fill="#00D26A" />
      <rect x="399" y="65" width="18" height="18" rx="2.5" fill="#00E676" />

      <rect x="376" y="88" width="18" height="18" rx="2.5" fill="#00C9A7" />
      <rect x="399" y="88" width="18" height="18" rx="2.5" fill="#00D26A" />

      <!-- Floating outward pixels -->
      <rect x="422" y="42" width="16" height="16" rx="2.5" fill="#00E676" />
      <rect x="399" y="19" width="16" height="16" rx="2.5" fill="#00D26A" />
      <rect x="422" y="65" width="16" height="16" rx="2.5" fill="#00C9A7" />
      <rect x="422" y="19" width="14" height="14" rx="2" fill="#00E676" />
      <rect x="443" y="42" width="14" height="14" rx="2" fill="#00D26A" />
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <!-- AutomatiQA -->
  <g font-family="'Outfit', 'Inter', -apple-system, system-ui, sans-serif">
    <text x="250" y="285" text-anchor="middle" font-size="62" font-weight="900" letter-spacing="-1">
      <tspan fill="#06152D">Automati</tspan>
      <tspan fill="url(#qaWordmarkGrad)">QA</tspan>
    </text>

    <!-- Tagline: FASTER • SMARTER • RELIABLE -->
    <text x="250" y="335" text-anchor="middle" font-size="17.5" font-weight="700" fill="#06152D" letter-spacing="5.5">
      FASTER <tspan fill="#00D26A" font-size="20">•</tspan> SMARTER <tspan fill="#00D26A" font-size="20">•</tspan> RELIABLE
    </text>
  </g>
</svg>